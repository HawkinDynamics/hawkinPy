[tool.poetry]
name = "hdforce"
version = "0.0.0" # Managed by tags
description = "Get your data from the Hawkin Dynamics API"
authors = ["laureng-hd <lauren@hawkindynamics.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://www.hawkindynamics.com/"
repository = "https://github.com/HawkinDynamics/hawkinPy"
documentation = "https://hawkindynamics.github.io/hawkinPy/"
exclude = ["dev/**"]
keywords = [
    "hawkin-dynamics",
    "force-plate",
    "sports-science",
    "biomechanics",
    "api-client",
    "performance-data",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = "^2.2.0"
python-dotenv = "^1.0.1"
requests = "^2.33.0"
pydantic = "^2.0.0" 
pyarrow = ">=18.1,<25.0"
pyjanitor = "^0.30"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<10.0" # Moved to dev
flake8 = "^7.0.0" # Moved to dev
ipykernel = ">=6.29.4,<8.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern-prefix = "py-v" # Matches your monorepo tag strategy

[build-system]
# Added dynamic-versioning to requirements for better install compatibility
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0"]
build-backend = "poetry_dynamic_versioning.backend"